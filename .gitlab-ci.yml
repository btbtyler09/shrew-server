stages:
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

pytest:
  stage: test
  # The instance runner is a shell executor on a host with PEP-668-managed
  # Python. Install into a per-job venv so we don't fight system Python.
  before_script:
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
  script:
    - . .venv/bin/activate
    - pip install -e ".[dev]"
    - pytest tests/ -v
  cache:
    key: pip-venv
    paths:
      - .venv/
