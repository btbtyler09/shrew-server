name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # server extra pulls fastapi/uvicorn/sse-starlette for the endpoint
      # tests; deliberately no torch/figures extra — the suite is designed
      # to run without heavy deps (mirrors .gitlab-ci.yml).
      - run: pip install -e ".[dev,server]"
      - run: pytest tests/ -v
