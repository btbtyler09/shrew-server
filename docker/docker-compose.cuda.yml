services:
  server:
    environment:
      - SHREW_VLLM_URL=http://shrew-model:8000
      - SHREW_ASYNC_STAGE3=1
    depends_on:
      shrew-model:
        condition: service_healthy

  shrew-model:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cuda
    ports:
      - "${SHREW_MODEL_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
