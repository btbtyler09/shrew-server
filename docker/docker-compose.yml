services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "${SHREW_PORT:-8080}:8080"
    environment:
      - VLM_URL=${VLM_URL}
      - VLM_MODEL=${VLM_MODEL:-}
      - VLM_API_KEY=${VLM_API_KEY:-}
      - VLM_CONCURRENCY=${VLM_CONCURRENCY:-4}
      - PIPELINE_CONCURRENCY=${PIPELINE_CONCURRENCY:-3}

  shrew-model:
    profiles: ["gpu"]
    ports:
      - "${SHREW_MODEL_PORT:-8000}:8000"
