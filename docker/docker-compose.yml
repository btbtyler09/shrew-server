services:
  shrew-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "${SHREW_PORT:-8080}:8080"
    environment:
      - VLM_URL=${VLM_URL}
      - VLM_MODEL=${VLM_MODEL:-}
      - VLM_API_KEY=${VLM_API_KEY:-}
      - VLM_CONCURRENCY=${VLM_CONCURRENCY:-4}
      - PIPELINE_CONCURRENCY=${PIPELINE_CONCURRENCY:-3}
      # Model contract: v0.5 (default) or v0.4 for a v0.4 / v0.4.1 model.
      - SHREW_CONTRACT=${SHREW_CONTRACT:-v0.5}
      - SHREW_FIGURE_CHECK=${SHREW_FIGURE_CHECK:-1}
      - SHREW_HEADING_FIX=${SHREW_HEADING_FIX:-1}
      - SHREW_LATEX_WRAP=${SHREW_LATEX_WRAP:-1}
      - SHREW_WORKERS=${SHREW_WORKERS:-1}
      - SECTION_MAX_TOKENS=${SECTION_MAX_TOKENS:-9000}
      - VLM_TIMEOUT_MARGIN=${VLM_TIMEOUT_MARGIN:-1.5}
      - DOCLING_DEVICE=${DOCLING_DEVICE:-auto}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-100}
      # Uploaded documents and everything derived from them live ONLY here
      # (README "Data handling"); the server refuses to start if it is not tmpfs.
      - SHREW_SCRATCH_DIR=/scratch/shrew
      # Run telemetry (content-free) on a volume: survives restarts and is not
      # capped by the small /tmp tmpfs.
      - SHREW_TELEMETRY_DIR=/var/lib/shrew/telemetry
    # Nothing is written to the container filesystem: a write that bypassed the
    # scratch dir would fail loudly instead of landing on disk.
    read_only: true
    tmpfs:
      # Size = peak scratch per document x PIPELINE_CONCURRENCY x SHREW_WORKERS
      #        + uploads waiting for a pipeline slot (2 x MAX_UPLOAD_MB each).
      # Measured peak per document (v0.5.3): scanned PDF 9.8 x its size, DOCX
      # 9.4x, XLSX 2.0x, born-digital PDF ~1.3 MB per PAGE (see README).
      # Defaults (100 MB, 3 slots, 1 worker, 3 waiting): 3 x 980 + 3 x 200 =
      # 3,540 MB -> 4g (scanned PDF / DOCX at the cap; a page-heavy born-digital
      # PDF needs ~1.3 MB per page). A full scratch dir fails that request with 507, never
      # falls back to disk. tmpfs is a cap, not a reservation: RAM is used only
      # while documents are in flight.
      - /scratch:size=${SHREW_SCRATCH_SIZE:-4g},mode=1777
      # Backstop for anything that ignores TMPDIR; measured peak use 0.1 MB.
      - /tmp:size=64m,mode=1777
    volumes:
      - shrew-telemetry:/var/lib/shrew
    # tmpfs pages can be swapped to disk. Disable swap for the container by
    # setting both limits to the same value (or run on a host without swap):
    # mem_limit: 16g
    # memswap_limit: 16g

volumes:
  shrew-telemetry:
