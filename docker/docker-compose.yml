services:
  shrew-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "${SHREW_PORT:-8080}:8080"
    environment:
      - VLM_URL=${VLM_URL}
      - VLM_MODEL=${VLM_MODEL:-}
      - VLM_API_KEY=${VLM_API_KEY:-}
      - VLM_CONCURRENCY=${VLM_CONCURRENCY:-4}
      - PIPELINE_CONCURRENCY=${PIPELINE_CONCURRENCY:-3}
      - SHREW_WORKERS=${SHREW_WORKERS:-1}
      - SECTION_MAX_TOKENS=${SECTION_MAX_TOKENS:-9000}
      - VLM_TIMEOUT_MARGIN=${VLM_TIMEOUT_MARGIN:-1.5}
      - DOCLING_DEVICE=${DOCLING_DEVICE:-auto}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

